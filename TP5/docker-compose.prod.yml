services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmanager-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin-prod
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - taskmanager-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - taskmanager-network
    depends_on:
      - task-service
      - notification-service

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    image: taskmanager/task-service:1.0.0
    container_name: task-service-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - taskmanager-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: taskmanager/notification-service:1.0.0
    container_name: notification-service-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - taskmanager-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taskmanager/frontend:1.0.0
    container_name: frontend-prod
    ports:
      - "3000:80"
    depends_on:
      - task-service
      - notification-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - taskmanager-network

networks:
  taskmanager-network:
    driver: bridge
