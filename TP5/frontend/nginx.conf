server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to task-service
    location /api/tasks {
        proxy_pass http://task-service:8080/api/tasks;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/categories {
        proxy_pass http://task-service:8080/api/categories;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API Requests to notification-service
    location /api/notifications {
        proxy_pass http://notification-service:8082/api/notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Actuator health/metrics for Task Service
    location /actuator/task-service/ {
        rewrite ^/actuator/task-service/(.*) /actuator/$1 break;
        proxy_pass http://task-service:8080;
        proxy_set_header Host $host;
    }

    # Proxy Actuator health/metrics for Notification Service
    location /actuator/notification-service/ {
        rewrite ^/actuator/notification-service/(.*) /actuator/$1 break;
        proxy_pass http://notification-service:8082;
        proxy_set_header Host $host;
    }

    # Container health check for Nginx
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
